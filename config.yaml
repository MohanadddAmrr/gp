app:
  name: TactiVision Pro
  version: 2.0.0
  description: Professional Football Analytics Platform
  debug: false
  log_level: INFO
  log_file: logs/tactivision.log
  max_log_size: 100MB
  log_backup_count: 5
video:
  default_fps: 25
  default_resolution:
  - 1920
  - 1080
  min_resolution:
  - 640
  - 480
  max_resolution:
  - 3840
  - 2160
  processing_threads: 4
  batch_size: 32
  frame_skip: 1
  buffer_size: 100
  chunk_size_minutes: 5
  memory_limit_percent: 80
  use_gpu: true
  gpu_memory_fraction: 0.8
  mixed_precision: true
  input_formats:
  - .mp4
  - .avi
  - .mov
  - .mkv
  - .wmv
  output_format: mp4
  output_codec: h264
  output_quality: high
detection:
  model: yolov8n.pt
  model_path: models/
  confidence_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 50
  target_classes:
  - 0
  - 32
  tracking:
    algorithm: bytetrack
    max_age: 30
    min_hits: 3
    iou_threshold: 0.3
    # M3 — Jersey + Position Re-ID layer (sits between tracker output and
    # TrackDeduplicator). Conservative thresholds to avoid false merges.
    reid_enabled: true
    reid_merge_distance_px: 120.0
    reid_max_lost_frames: 30
  player_id:
    enabled: true
    use_face_recognition: false
    use_jersey_numbers: true
    confidence_threshold: 0.7
ball_tracking:
  enabled: true
  detection_method: combined
  confidence_threshold: 0.3
  smoothing_factor: 0.3
  prediction_enabled: true
  max_prediction_frames: 10
  # P15 — RT-DETR ball-only second pass. Runs only on frames where the
  # primary detector missed the ball. Off by default: on CPU it adds a
  # per-frame cost; enable when ball-detection rate matters more than speed.
  second_pass:
    enabled: false
    weights: weights/rtdetr-l.pt
    confidence_threshold: 0.25
    crop_size: 640
    max_jump_px: 300
  enable_physics: true
  gravity: 9.81
  air_resistance: 0.02
  velocity_smoothing: 0.5
  min_velocity: 0.5
  max_velocity: 40.0
tactical:
  enabled: true
  formation:
    enabled: true
    detection_interval: 5
    smoothing_window: 10
    min_players: 8
  offside:
    enabled: true
    confirmation_frames: 5
    tolerance_meters: 0.5
  set_pieces:
    enabled: true
    detection_window: 3
    min_ball_velocity: 5.0
  dribbles:
    enabled: true
    min_dribble_distance: 2.0
    max_dribble_duration: 10.0
  pressing:
    enabled: true
    threshold: 2.5
    zone_radius: 10.0
  transitions:
    enabled: true
    possession_threshold: 0.5
    speed_threshold: 3.0
xg:
  enabled: true
  model: default
  model_path: models/xg_model.pkl
  max_shot_distance: 40.0
  max_shot_angle: 90.0
  weights:
    distance: 0.35
    angle: 0.25
    body_part: 0.15
    shot_type: 0.1
    pressure: 0.1
    assist_type: 0.05
  shot_types:
  - open_play
  - set_piece
  - penalty
  - free_kick
  - corner
  - header
physical:
  enabled: true
  speed:
    walking: 2.0
    jogging: 4.0
    running: 5.5
    sprinting: 7.0
  sprint:
    min_duration: 1.0
    min_speed: 5.5
    min_distance: 10.0
  distance:
    smoothing: 0.8
    calibration_method: pitch
    pitch_length: 105.0
    pitch_width: 68.0
  workload:
    enabled: true
    method: weighted
    decay_factor: 0.95
passing:
  enabled: true
  min_pass_distance: 3.0
  max_pass_duration: 5.0
  ball_possession_threshold: 0.5
  direction_thresholds:
    forward: 30
    backward: 150
  distance_thresholds:
    short: 15
    medium: 30
    long: 50
  network:
    enabled: true
    min_passes: 3
    max_edge_distance: 50
possession:
  enabled: true
  method: proximity
  proximity_radius: 2.0
  control_threshold: 0.5
  zones:
    defensive:
    - 0
    - 35
    midfield:
    - 35
    - 65
    attacking:
    - 65
    - 100
  smoothing_window: 25
highlights:
  enabled: true
  events:
  - goal
  - shot
  - save
  - card
  - substitution
  - VAR_review
  clip:
    pre_event_buffer: 5.0
    post_event_buffer: 10.0
    min_duration: 3.0
    max_duration: 30.0
  scoring:
    goal: 100
    penalty: 90
    red_card: 85
    VAR_goal: 80
    great_save: 70
    shot_on_target: 50
  output_format: mp4
  output_resolution:
  - 1920
  - 1080
  include_graphics: true
database:
  path: matches.db
  url: sqlite:///matches.db
  max_connections: 10
  connection_timeout: 30
  backup_enabled: true
  backup_interval: 3600
  backup_retention: 7
  backup_path: backups/
  vacuum_interval: 86400
  analyze_interval: 3600
dashboard:
  host: localhost
  port: 8501
  theme: dark
  primary_color: '#e63946'
  secondary_color: '#4361ee'
  accent_color: '#8b5cf6'
  auto_refresh: false
  refresh_interval: 30
  max_data_points: 1000
  enable_downloads: true
  enable_sharing: true
  enable_comparisons: true
  cache_ttl: 300
  max_upload_size: 200MB
broadcast:
  enabled: true
  scoreboard:
    enabled: true
    style: modern
    show_possession: true
    show_time: true
    show_score: true
  lower_thirds:
    enabled: true
    duration: 5.0
    animation: slide
  stats:
    enabled: true
    update_interval: 5
  fonts:
    primary: Inter
    secondary: Roboto
  colors:
    home: '#e63946'
    away: '#4361ee'
    neutral: '#ffffff'
    background: '#1a1a24'
streaming:
  enabled: false
  input:
    type: rtmp
    url: rtmp://localhost/live/stream
    buffer_size: 100
  output:
    enabled: false
    type: rtmp
    url: rtmp://youtube.com/live/...
    bitrate: 4500k
  webrtc:
    enabled: false
    signaling_server: ws://localhost:8080
  target_latency: 2.0
  max_latency: 5.0
social:
  enabled: true
  platforms:
    twitter:
      enabled: true
      max_duration: 140
      resolution:
      - 1920
      - 1080
      aspect_ratio: '16:9'
    instagram:
      enabled: true
      max_duration: 90
      resolution:
      - 1080
      - 1920
      aspect_ratio: '9:16'
    tiktok:
      enabled: true
      max_duration: 180
      resolution:
      - 1080
      - 1920
      aspect_ratio: '9:16'
    youtube:
      enabled: true
      max_duration: 60
      resolution:
      - 1920
      - 1080
      aspect_ratio: '16:9'
  auto_captions: true
  auto_hashtags: true
  watermark: true
wearable:
  enabled: false
  devices:
  - gps_vest
  - heart_rate_monitor
  - accelerometer
  import_formats:
  - gpx
  - fit
  - csv
  - json
  sync_interval: 1.0
  max_latency: 5.0
api:
  statsbomb:
    enabled: true
    base_url: https://raw.githubusercontent.com/statsbomb/open-data/master/data/
    rate_limit: 100
  football_data:
    enabled: false
    base_url: https://api.football-data.org/v4/
    api_key: ''
    rate_limit: 10
    cache_dir: cache/api_responses
  custom:
    enabled: false
    base_url: ''
    api_key: ''
    timeout: 30
