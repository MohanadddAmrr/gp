export:
  video:
    formats:
    - mp4
    - avi
    - mov
    - webm
    default_format: mp4
    codecs:
      mp4: h264
      avi: xvid
      mov: prores
      webm: vp9
  data:
    formats:
    - json
    - csv
    - xlsx
    - pdf
    default_format: json
    include_metadata: true
    include_raw_data: false
  report:
    template: default
    include_charts: true
    include_heatmaps: true
    include_video_clips: false
security:
  auth_enabled: false
  jwt_secret: ''
  token_expiry: 3600
  api_key_header: X-API-Key
  cors_origins:
  - http://localhost:8501
  - http://localhost:3000
  rate_limit_enabled: true
  rate_limit_requests: 100
  rate_limit_window: 60
performance:
  max_memory_usage: 4GB
  garbage_collection_interval: 300
  cpu_affinity: []
  process_priority: normal
  cache_enabled: true
  cache_size: 1GB
  cache_ttl: 3600
  max_workers: 4
  thread_pool_size: 8
development:
  hot_reload: false
  debug_mode: false
  verbose_logging: false
  profile_performance: false
  test_data_path: tests/data/
  mock_external_apis: true
  auto_generate_docs: false
  docs_port: 8080
